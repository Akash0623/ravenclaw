name: Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  check:
    name: Check Ravenclaw Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report
        run: |
          echo "=== Ravenclaw Status Check ==="
          echo "Time: $(date -u)"
          echo "Repo: Akash0623/ravenclaw"
          echo ""
          echo "Latest commit:"
          git log --oneline -1
          echo ""
          echo "Open PRs:"
          gh pr list --limit 5 || echo "No PRs"
          echo ""
          echo "CI Status:"
          gh run list --limit 3 || echo "No runs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
